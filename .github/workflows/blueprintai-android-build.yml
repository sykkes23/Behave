name: BlueprintAI Android Build

on:
  push:
    branches: [blueprintai-android-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Android source
        run: |
          mkdir -p /tmp/blueprintai
          base64 -d blueprintai-build/blueprintai-android-src.tar.gz.b64 > /tmp/blueprintai-src.tar.gz
          tar -xzf /tmp/blueprintai-src.tar.gz -C /tmp/blueprintai
      - name: Build APK
        run: cd /tmp/blueprintai && gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: blueprintai-android-debug-apk
          path: /tmp/blueprintai/app/build/outputs/apk/debug/app-debug.apk
