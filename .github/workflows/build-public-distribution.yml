name: Build Public Distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/build_public_distribution.py --output behave-public.zip
      - uses: actions/upload-artifact@v4
        with:
          name: behave-public-${{ github.sha }}
          path: |
            behave-public.zip
            behave-public.zip.sha256
          if-no-files-found: error
